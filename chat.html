<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Chat - FireLudo Pro</title>
    <style>
        /* --- RESET & VARIABLES (১০০% অপরিবর্তিত) --- */
        :root {
            --bg-body: #0f1115;
            --bg-card: #1a1d23;
            --text-white: #ffffff;
            --text-muted: #98a1ad;
            --green-send: #2ecc71;
            --accent-blue: #3b82f6; 
            --border-clr: rgba(255, 255, 255, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: #000; color: var(--text-white); display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        
        .app-container { 
            width: 100%; max-width: 420px; 
            background-color: var(--bg-body); 
            position: relative; 
            display: flex; flex-direction: column; 
            height: 100vh;
        }

        /* --- HEADER --- */
        .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; background: #1a1d23; border-bottom: 1px solid #2d323e; flex-shrink: 0; }
        .lang-selector { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .lang-selector img { width: 18px; border-radius: 2px; }
        .close-chat { color: var(--text-muted); font-size: 18px; cursor: pointer; }

        /* --- CHAT AREA --- */
        .chat-messages { 
            flex: 1; overflow-y: auto; 
            padding: 15px 12px 200px; 
            display: flex; flex-direction: column; gap: 12px; 
        }
        .chat-messages::-webkit-scrollbar { width: 0; }

        .msg-box { 
            background: #1e2124; padding: 10px 12px; border-radius: 8px; 
            display: flex; flex-direction: column; gap: 2px;
            width: fit-content; max-width: 85%;
            align-self: flex-start; 
            border: 1px solid rgba(255,255,255,0.02);
        }

        .my-msg { 
            background: #2d323e; 
            align-self: flex-end; 
            border-right: 3px solid var(--green-send);
            border-left: none;
        }

        .u-info { display: flex; align-items: center; gap: 6px; }
        .u-star { font-size: 11px; color: #4fd3ff; }
        .u-name { font-size: 12px; font-weight: 700; color: #98a1ad; }
        .my-msg .u-name { color: var(--green-send); } 
        .u-text { font-size: 13px; color: #fff; line-height: 1.4; }

        /* --- CHAT FOOTER --- */
        .chat-footer {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 420px; 
            background: #1a1d23;
            padding: 12px 15px;
            border-top: 1px solid #2d323e;
            z-index: 100;
        }

        .input-container {
            background: #0f1115; border: 1px solid #2d323e; border-radius: 6px;
            padding: 10px 12px; display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 10px;
        }
        .input-container input { background: transparent; border: none; outline: none; color: #fff; font-size: 13px; width: 85%; }
        .emoji-btn { font-size: 16px; cursor: pointer; }

        .footer-controls { display: flex; justify-content: space-between; align-items: center; }
        .online-info { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); }
        .online-dot { width: 6px; height: 6px; background: #2ecc71; border-radius: 50%; }
        
        .send-btn { 
            background: var(--green-send); color: #000; border: none; 
            padding: 10px 25px; border-radius: 4px; font-weight: 800; 
            font-size: 13px; cursor: pointer;
        }

        /* --- FIXED BOTTOM NAVIGATION ( মাপ এবং এলাইনমেন্ট ঠিক করা হয়েছে ) --- */
        .bottom-nav-container { 
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 92%; 
            max-width: 400px; 
            background: #181922; 
            border-radius: 25px; 
            padding: 0 10px; 
            height: 70px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border: 1px solid #2d2e3d; 
            z-index: 1000; 
            box-sizing: border-box;
        }
        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            color: #585966; 
            font-size: 10px; 
            gap: 4px; 
            cursor: pointer; 
            width: 20%; 
            text-decoration: none;
            transition: all 0.3s; 
            flex-shrink: 0;
        }
        .nav-item.active { color: white; }
        
        .wallet-btn-wrap {
            width: 20%;
            display: flex;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }
        .wallet-btn { 
            background: var(--accent-blue); 
            width: 54px; 
            height: 54px; 
            border-radius: 18px; 
            margin-top: -30px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: white; 
            border: 5px solid #0f1115; /* চ্যাট ব্যাকগ্রাউন্ডের সাথে ম্যাচ করা */
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4); 
            flex-shrink: 0;
        }

    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header">
        <div class="lang-selector">
            <img src="https://upload.wikimedia.org/wikipedia/en/a/ae/Flag_of_the_United_Kingdom.svg">
            English <span>▼</span>
        </div>
        <div class="close-chat" onclick="location.href='home.html'">✕</div>
    </div>

    <!-- Chat Messages -->
    <div class="chat-messages" id="chatBox">
        <div class="msg-box">
            <div class="u-info"><span class="u-star">★</span> <span class="u-name">Winning1850:</span></div>
            <div class="u-text">Sounds like typical stake</div>
        </div>
        <div class="msg-box">
            <div class="u-info"><span class="u-star" style="color:var(--green-send)">★</span> <span class="u-name">G553:</span></div>
            <div class="u-text">@LoveGummy lets go</div>
        </div>
        <div class="msg-box my-msg">
            <div class="u-info"><span class="u-star" style="color:var(--green-send)">★</span> <span class="u-name">You:</span></div>
            <div class="u-text">Hello everyone! Happy gaming.</div>
        </div>
    </div>

    <!-- Chat Footer -->
    <div class="chat-footer">
        <div class="input-container">
            <input type="text" id="msgInput" placeholder="Type your message">
            <span class="emoji-btn">😊</span>
        </div>
        
        <div class="footer-controls">
            <div class="online-info">
                <div class="online-dot"></div> Online: 57,186
            </div>
            <div class="controls-right">
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav-container">
        <a href="home.html" class="nav-item">
            <svg style="width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            <span>Home</span>
        </a>
        <a href="game.html" class="nav-item">
            <svg style="width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;" viewBox="0 0 24 24"><path d="M6 12h4M8 10v4M15 11h.01M18 13h.01M21 7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7Z"></path></svg>
            <span>Game</span>
        </a>
        <div class="wallet-btn-wrap">
            <a href="wallet.html" class="wallet-btn">
                <svg style="width:28px;height:28px;fill:none;stroke:white;stroke-width:2;" viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path></svg>
            </a>
        </div>
        <a href="chat.html" class="nav-item active">
            <svg style="width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            <span>Chat</span>
        </a>
        <a href="menu.html" class="nav-item">
            <svg style="width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            <span>Menu</span>
        </a>
    </div>
</div>

<script>
    function sendMessage() {
        let input = document.getElementById('msgInput');
        let chatBox = document.getElementById('chatBox');
        if(input.value.trim() !== "") {
            let newMsg = `
                <div class="msg-box my-msg">
                    <div class="u-info"><span class="u-star" style="color:var(--green-send)">★</span> <span class="u-name">You:</span></div>
                    <div class="u-text">${input.value}</div>
                </div>
            `;
            chatBox.innerHTML += newMsg;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }
    document.getElementById('msgInput').addEventListener("keypress", function(e) {
        if (e.key === "Enter") sendMessage();
    });
</script>

</body>
</html>
