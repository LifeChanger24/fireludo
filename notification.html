<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notification - FireLudo Pro</title>
    <style>
        /* --- অরিজিনাল RESET & VARIABLES --- */
        :root {
            --bg-body: #0e0f14;
            --bg-card: #1c1d26;
            --text-white: #ffffff;
            --text-muted: #98a1ad;
            --accent-blue: #3b82f6; 
            --green: #2ecc71;
            --border: rgba(255, 255, 255, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg-body); color: var(--text-white); display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        .app-container { width: 100%; max-width: 420px; background-color: var(--bg-body); position: relative; display: flex; flex-direction: column; }

        /* --- HEADER (Square Back Button) --- */
        .header { 
            display: flex; align-items: center; padding: 15px 20px; 
            position: sticky; top: 0; z-index: 100; background: var(--bg-body);
        }
        .back-box { 
            width: 35px; height: 35px; background: #252930; border-radius: 8px; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; color: var(--text-muted); border: 1px solid #333;
        }
        .header h2 { flex: 1; text-align: center; font-size: 17px; font-weight: 700; margin-right: 35px; }

        /* --- TAB SWITCHER --- */
        .tab-wrapper { display: flex; margin: 10px 15px; background: #1a1d23; padding: 4px; border-radius: 10px; gap: 4px; }
        .tab-btn { 
            flex: 1; padding: 10px; border: none; background: transparent; 
            color: var(--text-muted); font-weight: 700; border-radius: 8px; 
            cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .tab-btn.active { background: #2d323e; color: #fff; }
        .count-badge { background: var(--green); color: #000; font-size: 10px; padding: 1px 6px; border-radius: 10px; }

        /* --- CONTENT AREA --- */
        .notif-content { flex: 1; overflow-y: auto; padding: 10px 15px 100px; }
        .notif-content::-webkit-scrollbar { display: none; }

        /* --- NOTIFICATION CARD (Banner Size Updated) --- */
        .notif-card { background: var(--bg-card); border-radius: 20px; padding: 15px; margin-bottom: 20px; border: 1px solid var(--border); }
        
        .card-top { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); margin-bottom: 10px; }
        .live-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; box-shadow: 0 0 5px var(--green); }
        
        .card-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 15px; }
        
        /* ইমেজ সাইজ এখন হোম পেজের ব্যানারের মতো ১৬০ পিক্সেল উচ্চতার */
        .card-banner-box { 
            width: 100%; height: 160px; border-radius: 15px; overflow: hidden; 
            margin-bottom: 15px; border: 1px solid #2d323e; position: relative;
        }
        .card-banner-box img { width: 100%; height: 100%; object-fit: cover; }
        
        /* ইমেজের ওপর 'Show all' ড্রপডাউন (BC Game স্টাইল) */
        .show-all-overlay {
            position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6);
            padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: bold;
            display: flex; align-items: center; gap: 5px; color: white;
        }

        .card-footer { display: flex; justify-content: space-between; align-items: center; }
        .btn-join { background: #2d323e; color: var(--green); border: none; padding: 10px 25px; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .btn-join:active { transform: scale(0.95); }
        .delete-btn { color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 5px; }

        /* --- FOOTER --- */
        .footer-status { 
            position: fixed; bottom: 0; width: 100%; max-width: 420px; 
            background: #0e0f14; padding: 15px 20px; border-top: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }
        .mark-read { color: var(--green); font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 5px; cursor: pointer; }

    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header">
        <div class="back-box" onclick="location.href='home.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </div>
        <h2>Notification</h2>
    </div>

    <!-- Tabs -->
    <div class="tab-wrapper">
        <button class="tab-btn active" id="tab-promo" onclick="switchTab('promo')">Promotions <span class="count-badge">2</span></button>
        <button class="tab-btn" id="tab-trans" onclick="switchTab('trans')">Transactions</button>
    </div>

    <!-- Notifications List -->
    <div class="notif-content" id="notif-list">
        
        <!-- Notif Item 1 (Home Banner Size) -->
        <div class="notif-card">
            <div class="card-top">
                <span>12/31/2025, 5:23:12 AM</span>
                <div class="live-dot"></div>
            </div>
            <div class="card-title">💰 PG Daily Rank – Share $10,000</div>
            <div class="card-banner-box">
                <img src="https://i.ibb.co/NdvKg4f3/1767132827286.png">
                <div class="show-all-overlay">Show all <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="6 9 12 15 18 9"></polyline></svg></div>
            </div>
            <div class="card-footer">
                <button class="btn-join" onclick="location.href='game.html'">Join Now</button>
                <div class="delete-btn">🗑️</div>
            </div>
        </div>

        <!-- Notif Item 2 (Home Banner Size) -->
        <div class="notif-card">
            <div class="card-top">
                <span>12/27/2025, 12:18:33 PM</span>
            </div>
            <div class="card-title">🎁 Its Weekly Rewards Time! 🏆</div>
            <div class="card-banner-box">
                <img src="https://img.freepik.com/free-vector/modern-ludo-board-game-illustration_23-2148904576.jpg">
                <div class="show-all-overlay">Show all <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="6 9 12 15 18 9"></polyline></svg></div>
            </div>
            <div class="card-footer">
                <button class="btn-join" onclick="location.href='bonus.html'">Claim Now</button>
                <div class="delete-btn">🗑️</div>
            </div>
        </div>

    </div>

    <!-- Footer Status -->
    <div class="footer-status">
        <div style="font-size: 12px; color: var(--text-muted);">
            Show unread 🔘
        </div>
        <div class="mark-read">
            <span>✓ mark all as read</span>
        </div>
    </div>
</div>

<script>
    function switchTab(tab) {
        document.getElementById('tab-promo').classList.toggle('active', tab === 'promo');
        document.getElementById('tab-trans').classList.toggle('active', tab === 'trans');
        
        let list = document.getElementById('notif-list');
        if(tab === 'trans') {
            list.innerHTML = '<div style="text-align:center; padding-top:100px; color:gray; font-size:13px;">No transactions found.</div>';
        } else {
            location.reload(); 
        }
    }
</script>

</body>
</html>
