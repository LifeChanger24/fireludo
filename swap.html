<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swap - Fiery Ludo</title>
    <style>
        /* --- RESET & VARIABLES --- */
        :root {
            --bg-body: #0B0E14; 
            --bg-card: #1e2029;
            
            --gold: #FFD700;
            --usdt-green: #26a17b;
            --text-white: #ffffff;
            --text-gray: #94a3b8;
            --border: rgba(255,255,255,0.1);
            
            --ludo-blue: #3b82f6; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #000;
            display: flex; justify-content: center; min-height: 100vh;
        }

        .app-container {
            width: 100%; max-width: 420px;
            background-color: var(--bg-body);
            position: relative; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* --- HEADER --- */
        .header {
            padding: 20px; display: flex; align-items: center; justify-content: space-between;
            background: #151921; border-bottom: 1px solid var(--border);
            z-index: 10;
        }
        .back-btn { 
            font-size: 24px; color: white; cursor: pointer; 
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.05); border-radius: 50%;
        }
        .back-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.1); }
        
        .title { font-size: 18px; font-weight: bold; color: white; flex-grow: 1; margin-left: 15px; }
        .history-btn { font-size: 20px; color: var(--text-gray); cursor: pointer; }

        /* --- CONTENT AREA --- */
        .content { 
            padding: 20px; flex: 1; overflow-y: auto; 
            padding-bottom: 40px; /* নেভিগেশন বার নেই তাই প্যাডিং কমানো হয়েছে */
        }

        /* --- SWAP CARDS --- */
        .swap-wrapper { display: flex; flex-direction: column; gap: 5px; position: relative; }

        .swap-card {
            background: var(--bg-card); padding: 15px 20px; border-radius: 16px;
            border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px;
        }
        
        .label { font-size: 12px; color: var(--text-gray); font-weight: 600; }
        
        .input-row { display: flex; justify-content: space-between; align-items: center; }
        
        .amount-input {
            background: transparent; border: none; color: white; font-size: 24px; font-weight: bold;
            width: 60%; outline: none;
        }
        .amount-input::placeholder { color: #555; }

        /* Token Badge */
        .token-badge {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 20px;
            cursor: pointer; border: 1px solid var(--border);
        }
        .t-icon { width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; }
        .icon-gold { background: var(--gold); color: black; }
        .icon-usdt { background: var(--usdt-green); color: white; }
        .t-name { font-size: 14px; font-weight: bold; color: white; }
        .t-arrow { font-size: 10px; color: var(--text-gray); }

        /* Middle Swap Button */
        .swap-icon-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 44px; height: 44px; background: #2d3240; border: 4px solid var(--bg-body);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 5; box-shadow: 0 0 15px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        .swap-icon-box:active { transform: translate(-50%, -50%) scale(0.9); }
        
        .rotate-anim { animation: spin 0.3s ease; }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(180deg); } }

        /* Info Section */
        .info-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 15px; padding: 0 5px;
        }
        .rate-text { font-size: 12px; color: var(--text-gray); }
        .refresh-icon { font-size: 14px; color: var(--ludo-blue); cursor: pointer; }

        /* Percent Buttons */
        .percent-row { display: flex; gap: 10px; margin-top: 30px; justify-content: space-between; }
        .pct-btn {
            flex: 1; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            border-radius: 10px; color: var(--text-gray); font-size: 12px; font-weight: bold; cursor: pointer;
            transition: 0.2s;
        }
        .pct-btn:active { background: var(--ludo-blue); color: white; border-color: var(--ludo-blue); }

        /* Available Balance */
        .balance-info { margin-top: 15px; font-size: 12px; color: var(--text-gray); display: flex; justify-content: space-between; }
        .bal-val { color: var(--text-white); font-weight: bold; }

        /* Main Button */
        .main-btn {
            width: 100%; padding: 16px; border-radius: 14px; border: none;
            background: var(--ludo-blue); color: white; font-size: 16px; font-weight: bold;
            margin-top: 40px; cursor: pointer; box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
            transition: 0.2s;
        }
        .main-btn:active { transform: scale(0.97); opacity: 0.9; }

    </style>
</head>
<body>

<div class="app-container">

    <!-- HEADER - Back to Wallet -->
    <div class="header">
        <div class="back-btn" onclick="window.location.href='wallet.html'">&#8592;</div>
        <div class="title">Swap Assets</div>
        <div class="history-btn">🕒</div>
    </div>

    <!-- CONTENT -->
    <div class="content">

        <!-- SWAP AREA -->
        <div class="swap-wrapper">
            
            <!-- FROM CARD -->
            <div class="swap-card" id="cardFrom">
                <div class="input-row">
                    <span class="label">From</span>
                    <span class="label">Balance: <span class="bal-val" id="balFrom">500.00</span></span>
                </div>
                <div class="input-row">
                    <input type="number" class="amount-input" id="inpFrom" placeholder="0" oninput="calculateSwap()">
                    <div class="token-badge">
                        <div class="t-icon icon-gold" id="iconFrom">🟡</div>
                        <span class="t-name" id="txtFrom">GOLD</span>
                        <span class="t-arrow">▼</span>
                    </div>
                </div>
            </div>

            <!-- SWAP ICON (Middle) -->
            <div class="swap-icon-box" onclick="toggleSwap()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 10l5-6 5 6"></path>
                    <path d="M12 4v12"></path>
                    <path d="M17 14l-5 6-5-6"></path>
                    <path d="M12 20v-6"></path>
                </svg>
            </div>

            <!-- TO CARD -->
            <div class="swap-card" id="cardTo">
                <div class="input-row">
                    <span class="label">To (Estimate)</span>
                    <span class="label">Balance: <span class="bal-val" id="balTo">100.00</span></span>
                </div>
                <div class="input-row">
                    <input type="number" class="amount-input" id="inpTo" placeholder="0" readonly>
                    <div class="token-badge">
                        <div class="t-icon icon-usdt" id="iconTo">₮</div>
                        <span class="t-name" id="txtTo">USDT</span>
                        <span class="t-arrow">▼</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- RATE INFO -->
        <div class="info-row">
            <span class="rate-text" id="rateText">1 GOLD ≈ 0.10 USDT</span>
            <span class="refresh-icon">🔄</span>
        </div>

        <!-- PERCENTAGE BUTTONS -->
        <div class="percent-row">
            <button class="pct-btn" onclick="setPercent(0.25)">25%</button>
            <button class="pct-btn" onclick="setPercent(0.50)">50%</button>
            <button class="pct-btn" onclick="setPercent(0.75)">75%</button>
            <button class="pct-btn" onclick="setPercent(1)">MAX</button>
        </div>

        <!-- SWAP BUTTON -->
        <button class="main-btn" onclick="confirmSwap()">Swap Now</button>

    </div>

</div>

<script>
    // --- SWAP LOGIC ---
    let rate = 0.10; // 1 Gold = 0.10 USDT
    let isGoldToUsdt = true;
    let balanceGold = 500.00;
    let balanceUsdt = 100.00;

    function calculateSwap() {
        const input = document.getElementById('inpFrom').value;
        const output = document.getElementById('inpTo');
        
        if(input === '') {
            output.value = '';
            return;
        }

        let result;
        if(isGoldToUsdt) {
            result = input * rate;
        } else {
            result = input / rate;
        }
        output.value = result.toFixed(2);
    }

    function setPercent(pct) {
        const bal = isGoldToUsdt ? balanceGold : balanceUsdt;
        const amount = (bal * pct).toFixed(2);
        document.getElementById('inpFrom').value = amount;
        calculateSwap();
    }

    function toggleSwap() {
        const btn = document.querySelector('.swap-icon-box');
        btn.classList.add('rotate-anim');
        setTimeout(() => btn.classList.remove('rotate-anim'), 300);

        isGoldToUsdt = !isGoldToUsdt;
        
        const fromTxt = document.getElementById('txtFrom');
        const toTxt = document.getElementById('txtTo');
        const fromIcon = document.getElementById('iconFrom');
        const toIcon = document.getElementById('iconTo');
        const fromBal = document.getElementById('balFrom');
        const toBal = document.getElementById('balTo');
        const rateTxt = document.getElementById('rateText');

        if(isGoldToUsdt) {
            fromTxt.innerText = "GOLD"; toTxt.innerText = "USDT";
            fromIcon.innerText = "🟡"; toIcon.innerText = "₮";
            fromIcon.className = "t-icon icon-gold"; toIcon.className = "t-icon icon-usdt";
            fromBal.innerText = balanceGold.toFixed(2); toBal.innerText = balanceUsdt.toFixed(2);
            rateTxt.innerText = "1 GOLD ≈ 0.10 USDT";
        } else {
            fromTxt.innerText = "USDT"; toTxt.innerText = "GOLD";
            fromIcon.innerText = "₮"; toIcon.innerText = "🟡";
            fromIcon.className = "t-icon icon-usdt"; toIcon.className = "t-icon icon-gold";
            fromBal.innerText = balanceUsdt.toFixed(2); toBal.innerText = balanceGold.toFixed(2);
            rateTxt.innerText = "1 USDT ≈ 10.0 GOLD";
        }
        
        document.getElementById('inpFrom').value = '';
        document.getElementById('inpTo').value = '';
    }

    function confirmSwap() {
        const amt = document.getElementById('inpFrom').value;
        if(!amt || amt <= 0) {
            alert("Please enter a valid amount.");
            return;
        }
        alert("Swapping " + amt + " assets...");
    }

</script>

</body>
</html>
