<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bonus - FireLudo Pro</title>
    <style>
        /* --- অরিজিনাল RESET & VARIABLES --- */
        :root {
            --bg-body: #0e0f14;
            --bg-card: #1c1d26;
            --text-white: #ffffff;
            --text-muted: #8b8c99;
            --accent-blue: #3b82f6; 
            --gold: #FFD700;
            --green: #4ADE80;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg-body); color: var(--text-white); display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        .app-container { width: 100%; max-width: 420px; background-color: var(--bg-body); position: relative; padding-bottom: 30px; }

        /* --- HEADER (Back to Home) --- */
        .header { 
            display: flex; align-items: center; padding: 20px; 
            background: rgba(14, 15, 20, 0.95); gap: 15px; position: sticky; top: 0; z-index: 100;
        }
        .back-btn { 
            font-size: 24px; cursor: pointer; color: white; background: rgba(255,255,255,0.1); 
            width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; 
        }
        .header h2 { font-size: 18px; font-weight: 800; }

        /* --- TOP TABS (Bonus & Rank) --- */
        .tab-container { display: flex; margin: 10px 20px 25px; background: #1a1d23; padding: 5px; border-radius: 15px; border: 1px solid #2d323e; gap: 5px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; color: var(--text-muted); font-weight: 700; border-radius: 10px; cursor: pointer; font-size: 13px; transition: 0.3s; }
        .tab-btn.active { background: var(--accent-blue); color: white; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }

        /* --- REWARD GRID --- */
        .reward-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 20px; }
        .reward-box { 
            background: rgba(30, 32, 41, 0.8); border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 18px; padding: 18px 15px; text-align: center; 
            display: flex; flex-direction: column; justify-content: space-between; min-height: 170px; 
        }
        .r-icon { font-size: 32px; margin-bottom: 10px; }
        .r-title { font-size: 15px; font-weight: 700; color: white; }
        .r-desc { font-size: 10px; color: var(--text-muted); margin: 5px 0 12px; line-height: 1.3; }
        .btn-claim { width: 100%; padding: 10px; border-radius: 8px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; background: var(--accent-blue); color: white; }
        
        /* --- REFERRAL SECTION --- */
        .referral-card { 
            background: #161923; border-radius: 25px; padding: 30px 20px; 
            border: 1px solid rgba(255,255,255,0.05); text-align: center; 
            margin: 30px 20px; box-shadow: 0 -10px 30px rgba(0,0,0,0.4);
        }
        .ref-title { color: var(--gold); font-weight: 800; font-size: 18px; margin-bottom: 8px; }
        .ref-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 20px; }
        .ref-box { 
            background: rgba(0,0,0,0.3); border: 1px dashed #444; padding: 14px; 
            border-radius: 12px; margin-bottom: 20px; font-family: monospace; 
            letter-spacing: 2px; color: white; font-weight: bold; font-size: 18px; 
        }
        .share-btn { width: 100%; padding: 15px; border-radius: 14px; border: none; font-weight: 800; background: white; color: black; cursor: pointer; font-size: 14px; }

    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header">
        <div class="back-btn" onclick="location.href='home.html'">←</div>
        <h2>Bonus Center</h2>
    </div>

    <!-- Top Tabs (কানেক্টেড টু rank.html) -->
    <div class="tab-container">
        <button class="tab-btn active">Bonus</button>
        <button class="tab-btn" onclick="location.href='rank.html'">Rank</button>
    </div>

    <!-- Bonus Content -->
    <div class="reward-grid">
        <!-- Weekly Bonus -->
        <div class="reward-box">
            <div><div class="r-icon">📅</div><div class="r-title">Weekly Bonus</div><div class="r-desc">Claim your loyalty rewards every week.</div></div>
            <button class="btn-claim" style="background:rgba(255,255,255,0.1); color:#777;">04d 12h</button>
        </div>

        <!-- Watch & Earn -->
        <div class="reward-box" style="border: 1px solid rgba(255, 65, 108, 0.3);">
            <div><div class="r-icon">🎬</div><div class="r-title">Watch & Earn</div><div class="r-desc">Watch ads and earn instant gold coins.</div></div>
            <button class="btn-claim" style="background: linear-gradient(45deg, #FF416C, #FF4B2B);">▶ Watch Now</button>
        </div>

        <!-- Monthly Bonus -->
        <div class="reward-box">
            <div><div class="r-icon">💎</div><div class="r-title">Monthly Bonus</div><div class="r-desc">Exclusive rewards for our VIP players.</div></div>
            <button class="btn-claim" style="background:#333; color:#555;">Locked 🔒</button>
        </div>

        <!-- Promo Code -->
        <div class="reward-box">
            <div><div class="r-icon">🎟️</div><div class="r-title">Promo Code</div><input type="text" placeholder="Enter Code" style="width:100%; padding:8px; background:#000; border:1px solid #333; border-radius:8px; color:#fff; font-size:10px; text-align:center; margin-top:8px; outline:none;"></div>
            <button class="btn-claim" style="margin-top:10px;">Claim Code</button>
        </div>
    </div>

    <!-- Referral Section -->
    <div class="referral-card">
        <div class="ref-title">Refer & Earn USDT</div>
        <div class="ref-desc">Invite your friends and earn 5% of their total winnings forever!</div>
        <div class="ref-box">KIBREIT24</div>
        <button class="share-btn">📤 Share Invite Link</button>
    </div>
</div>

</body>
</html>
