<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assets - FireLudo Pro</title>
    <style>
        /* --- অরিজিনাল RESET & VARIABLES (১০০% অপরিবর্তিত) --- */
        :root {
            --bg-body: #0e0f14;
            --text-white: #ffffff;
            --text-muted: #8b8c99;
            --accent-blue: #3b82f6; 
            --green-usdt: #26A17B; 
            --gold-clr: #FFD700;
            --border: rgba(255, 255, 255, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: #000; color: var(--text-white); display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        .app-container { width: 100%; max-width: 420px; background-color: var(--bg-body); position: relative; padding-bottom: 110px; }

        /* --- HEADER --- */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 25px 20px 0; position: sticky; top: 0; z-index: 100; background: var(--bg-body); }
        .header-left { flex: 1; }
        .header h2 { font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 8px; }
        .header-line { width: 85%; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0.2), transparent); }
        
        .history-circle { 
            width: 32px; height: 32px; border-radius: 50%; border: 1px solid #333; 
            display: flex; justify-content: center; align-items: center; cursor: pointer; background: #1a1d23;
        }

        /* --- BALANCE AREA --- */
        .balance-area { display: flex; justify-content: space-between; padding: 30px 20px 20px; }
        .bal-box { display: flex; flex-direction: column; gap: 5px; }
        .bal-box.right { text-align: right; }
        .label { font-size: 11px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.5px; }
        .val { font-size: 26px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }

        .usdt-txt { color: var(--green-usdt); }
        .gold-txt { color: var(--gold-clr); }

        /* --- ACTION BUTTONS --- */
        .action-row { display: flex; justify-content: space-between; padding: 15px 20px; margin-bottom: 10px; }
        .act-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; flex: 1; }
        .act-icon { width: 50px; height: 50px; border-radius: 50%; background: #1c1d26; display: flex; justify-content: center; align-items: center; border: 1px solid #333; transition: 0.2s; }
        .act-btn:active .act-icon { transform: scale(0.9); background: #2d2e3d; }
        .act-icon svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2.2; }
        .act-btn span { font-size: 11px; font-weight: 600; color: var(--text-muted); }

        /* --- COIN LIST --- */
        .coin-list { padding: 0 20px; }
        .coin-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
        .coin-item:last-child { border-bottom: none; }
        .coin-left { display: flex; align-items: center; gap: 14px; }
        
        .icon-circle { width: 38px; height: 38px; border-radius: 50%; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #1a1d23; }
        .icon-circle img { width: 100%; height: 100%; object-fit: cover; }
        
        .coin-info h4 { font-size: 14px; font-weight: 700; color: #fff; }
        .coin-info p { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
        .coin-right { text-align: right; }
        .coin-bal { font-size: 14px; font-weight: 700; color: #fff; }
        .coin-usd { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

        /* --- FIXED BOTTOM NAV ( মাপ এবং এলাইনমেন্ট ঠিক করা হয়েছে ) --- */
        .bottom-nav-container { 
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 92%; 
            max-width: 400px; 
            background: #181922; 
            border-radius: 25px; 
            padding: 0 10px; 
            height: 70px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border: 1px solid #2d2e3d; 
            z-index: 1000; 
            box-sizing: border-box;
        }
        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            color: #585966; 
            font-size: 10px; 
            gap: 4px; 
            cursor: pointer; 
            width: 20%; 
            text-decoration: none;
            transition: all 0.3s; 
            flex-shrink: 0;
        }
        .nav-item.active { color: white; }
        
        .wallet-btn-wrap {
            width: 20%;
            display: flex;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }
        .wallet-btn { 
            background: var(--accent-blue); 
            width: 54px; 
            height: 54px; 
            border-radius: 18px; 
            margin-top: -30px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: white; 
            border: 5px solid var(--bg-body); 
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4); 
            flex-shrink: 0;
        }

    </style>
</head>
<body>

<div class="app-container">

    <!-- Coin List -->

            </div>

    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav-container">
        <a href="home.html" class="nav-item">
            <svg style="width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>

        <div class="wallet-btn-wrap">
